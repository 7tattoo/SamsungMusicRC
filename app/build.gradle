plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// ── 签名凭据不入库 ──────────────────────────────────────────────────────────
// 读取顺序：local.properties（已在 .gitignore）→ 环境变量（CI 用 secrets 注入）→ 跳过签名。
//   local.properties: key.store.file / key.store.password / key.alias / key.alias.password
//   环境变量:         KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
// 未提供凭据时 release 不签名，产出 app-release-unsigned.apk（便于第三方自行构建）。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def signingSecret = { String propKey, String envKey, String fallback = null ->
    localProps.getProperty(propKey) ?: System.getenv(envKey) ?: fallback
}

def ksFile = file(signingSecret('key.store.file', 'KEYSTORE_FILE', '7tattoo.jks'))
def ksAlias = signingSecret('key.alias', 'KEY_ALIAS', '7tattoo')
def ksStorePass = signingSecret('key.store.password', 'KEYSTORE_PASSWORD')
def ksKeyPass = signingSecret('key.alias.password', 'KEY_PASSWORD')
def releaseSigningReady = ksFile.exists() && ksStorePass != null && ksKeyPass != null

android {
    namespace 'com.spotify.music'
    compileSdk 36

    defaultConfig {
        applicationId "com.spotify.music"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndkVersion '27.2.12479018'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile ksFile
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 无凭据时不签名（产物为 *-unsigned.apk），避免他人 clone 后构建直接失败
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug 复用同一把钥匙，方便与 Release 包互相覆盖安装；
            // 无凭据时退回 AGP 默认 debug.keystore，不让他人 clone 后连 debug 都跑不起来
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency {
        if (requested.group == "org.jetbrains.kotlin" && requested.name.startsWith("kotlin-stdlib")) {
            useVersion("2.0.21")
            because("align kotlin-stdlib with the Kotlin 2.0.21 compiler")
        }
    }
}

dependencies {
    def media3_version = "1.11.0"

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.google.oboe:oboe:1.9.0'
}

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licenses + NDK/CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # 凭据全部来自仓库 Secrets，工作流文件里不出现任何口令字面量。
      # 需要配置：SIGNING_JKS_BASE64（keystore 的 base64）、
      #           SIGNING_KEYSTORE_PASSWORD、SIGNING_KEY_PASSWORD、SIGNING_KEY_ALIAS（可选，默认 7tattoo）
      - name: Restore signing key
        env:
          SIGNING_JKS: ${{ secrets.SIGNING_JKS_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_JKS" ] || [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "未配置签名 Secrets，本次产出未签名 APK（app-release-unsigned.apk）"
            echo "has_signing=false" >> "$GITHUB_ENV"
          else
            echo "$SIGNING_JKS" | base64 -d > app/7tattoo.jks
            test -s app/7tattoo.jks
            echo "has_signing=true" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamsungMusic-release-apk
          path: out/*.apk
